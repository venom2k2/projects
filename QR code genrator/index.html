<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <div id="heading">
        <h1>QR code generator</h1> 
    </div>
    <div class="inputbox">
        <div class="inputarea">
            <label>Enter the url or text to generate QR Code</label><br><br>
            <input type="text" id="inputfield" placeholder="Type here...">
             <div class="result">
                    <img  src="" id="qr" alt="" >
                   
                
                <p id="tag" style="font-size: 20px;">Your QR generates here</p> 
                <div id="spin"></div>
                </div>
        </div>
       <div class="img" >
        <img src="qr-code.svg" alt="" width="200px" height="300px">
       </div>
      
    </div>
   

    <button id="btn" onclick="showspinner()" style="font-size: 15px; font-style: italic; font-family: Georgia, 'Times New Roman', Times, serif; ">Generate QR</button>

 
   
    
    <script src="file.js"></script>
</body>
</html>
