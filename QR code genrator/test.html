<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body >
   
   
    <h1>Welcome to CSS animation</h1>
    <div class="animate">
       
    </div>
    <br><br>
    <div class="container">
        hover me
        <div class="tooltiptext">
            tooltiptext
        </div>

    </div>
   
    <style>
        h1{
            text-align: center;
        }
        .animate{
           
            height: 100px;
            width: 100px;
            border: 2px solid black;
            transition-timing-function: ease-out;
            transition: height 2s ,width 2s,background-color 3s, transform 2s
        }
        div:hover {
           
             
            /* background-color: aqua; */
             transform: scale(2,2);
               
        }
        .container{
            border-radius: 6px;
            border-bottom: 2px solid green;
            width: 20%;
            padding-left: 50px;
            margin-left: 80px;
            position: relative;
            display: inline; 
        }
        .container:hover .tooltiptext{
            visibility: visible;
        }
        .tooltiptext{
            border-radius: 6px;
            visibility: hidden;
            border: 1 px solid black;
            position: absolute;
            top: 10px;
            left: 150px;
            background-color: grey;
            color: white;
        }
        body{
            background-color: rgb(22, 206, 120);
        }
             
       @media  screen and (min-width: 800px){
        body{
            background-color:aqua;
        }
       }
    </style>
</body>
</html>
